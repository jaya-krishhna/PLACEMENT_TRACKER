openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Placement Tracker account and application API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Student account operations
  - name: applications
    description: Placement application management
  - name: dashboard
    description: Dashboard summaries and insights
  - name: gmail
    description: Gmail integration and sync operations
  - name: review
    description: Review queue for ambiguous or uncertain email events
  - name: reminders
    description: Reminders and notifications for upcoming events and required actions
  - name: calendar
    description: Calendar events and ICS exports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to a student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in student
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out of the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications for the signed-in student
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Student applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Add a company application
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /applications/export:
    get:
      operationId: exportApplications
      tags: [applications]
      summary: Download all applications as CSV
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /applications/samples:
    delete:
      operationId: deleteSampleApplications
      tags: [applications]
      summary: Remove all sample applications from the signed-in student's account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Sample applications removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get one application
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update one application
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete one application
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Application deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /applications/{id}/timeline:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getApplicationTimeline
      tags: [applications]
      summary: Get timeline events for an application
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationTimelineEvent"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /applications/{id}/events/{eventId}/undo:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: undoApplicationEvent
      tags: [applications]
      summary: Undo the latest application event
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Event undone successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get status totals, rejection rounds, and upcoming deadlines
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/status:
    get:
      operationId: getGmailStatus
      tags: [gmail]
      summary: Get Gmail integration status
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Gmail status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailStatusResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/connect:
    get:
      operationId: getGmailConnectUrl
      tags: [gmail]
      summary: Get Google OAuth authorization URL
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailConnectResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/callback:
    get:
      operationId: handleGmailCallback
      tags: [gmail]
      summary: OAuth callback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to settings
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/connection:
    delete:
      operationId: disconnectGmail
      tags: [gmail]
      summary: Disconnect Gmail and revoke tokens
      security:
        - sessionCookie: []
      parameters:
        - name: deleteEmailData
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Disconnected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/labels:
    get:
      operationId: getGmailLabels
      tags: [gmail]
      summary: List user Gmail labels
      security:
        - sessionCookie: []
      responses:
        "200":
          description: List of labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GmailLabel"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/label:
    put:
      operationId: updateGmailLabel
      tags: [gmail]
      summary: Set monitored Gmail label
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGmailLabelInput"
      responses:
        "200":
          description: Label updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailLabelUpdatedResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/senders:
    get:
      operationId: getGmailSenders
      tags: [gmail]
      summary: List sender rules
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, excluded]
      responses:
        "200":
          description: List of sender rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SenderRule"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createGmailSender
      tags: [gmail]
      summary: Manually add a sender rule
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSenderRuleInput"
      responses:
        "201":
          description: Sender rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderRule"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/senders/{id}:
    patch:
      operationId: updateGmailSender
      tags: [gmail]
      summary: Update sender rule status
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSenderRuleInput"
      responses:
        "200":
          description: Sender rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderRule"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/sync:
    post:
      operationId: syncGmail
      tags: [gmail]
      summary: Trigger manual sync
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Sync results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSyncResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/process:
    post:
      operationId: processGmailEmails
      tags: [gmail]
      summary: Trigger manual processing and extraction of queued emails
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmailProcessInput"
      responses:
        "200":
          description: Processing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailProcessResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/events:
    get:
      operationId: getGmailEvents
      tags: [gmail]
      summary: List email events with optional status filter and pagination
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of email events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailEventsResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/events/{id}/reprocess:
    post:
      operationId: reprocessGmailEvent
      tags: [gmail]
      summary: Re-queue one email event for reprocessing
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reprocessed email event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailEventItem"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /gmail/apply:
    post:
      operationId: applyGmailEmails
      tags: [gmail]
      summary: Apply extracted emails to applications
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Apply summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailApplyResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /review:
    get:
      operationId: getReviewQueue
      tags: [review]
      summary: Get items in the review queue
      security:
        - sessionCookie: []
      responses:
        "200":
          description: List of items requiring review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewQueueItem"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /review/{emailEventId}/resolve:
    parameters:
      - name: emailEventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resolveReviewItem
      tags: [review]
      summary: Resolve a review item by linking, creating, or dismissing
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReviewInput"
      responses:
        "200":
          description: Review item resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /reminders:
    get:
      operationId: getReminders
      tags: [reminders]
      summary: Get active reminders
      security:
        - sessionCookie: []
      responses:
        "200":
          description: List of active reminders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemindersResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /reminders/dismiss:
    post:
      operationId: dismissReminder
      tags: [reminders]
      summary: Dismiss a single reminder
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissReminderInput"
      responses:
        "200":
          description: Reminder dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /reminders/dismiss-all:
    post:
      operationId: dismissAllReminders
      tags: [reminders]
      summary: Dismiss all active reminders
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All reminders dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DismissAllRemindersResult"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /calendar/events:
    get:
      operationId: getCalendarEvents
      tags: [calendar]
      summary: Get calendar events in a date range
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEventItem"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /calendar/export.ics:
    get:
      operationId: exportCalendarIcs
      tags: [calendar]
      summary: Export all upcoming calendar events as ICS
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Calendar ICS file
          content:
            text/calendar:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /applications/{id}/event.ics:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: exportApplicationEventIcs
      tags: [calendar]
      summary: Export single application event as ICS
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Event ICS file
          content:
            text/calendar:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: placement_session
  responses:
    ErrorResponse:
      description: Request error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    ApplicationStatus:
      type: string
      enum: [APPLIED, SCREENING, TEST, INTERVIEW, ACCEPTED, REJECTED, WITHDRAWN]
    ApplicationMode:
      type: string
      enum: [On-campus, Off-campus, Referral, "Job portal", Unknown]
    RejectionRound:
      type: string
      enum:
        - Resume shortlisting
        - Aptitude/online test
        - Coding round
        - Technical interview
        - HR interview
        - Other
    Application:
      type: object
      required:
        - id
        - companyName
        - appliedDate
        - mode
        - status
        - isSample
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
        role:
          type: ["string", "null"]
        packageLpa:
          type: ["number", "null"]
        location:
          type: ["string", "null"]
        appliedDate:
          type: string
          format: date
        mode:
          $ref: "#/components/schemas/ApplicationMode"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        nextDate:
          type: ["string", "null"]
          format: date
        contactName:
          type: ["string", "null"]
        contactEmailOrPhone:
          type: ["string", "null"]
        jobLink:
          type: ["string", "null"]
          format: uri
        notes:
          type: ["string", "null"]
        rejectionRound:
          oneOf:
            - $ref: "#/components/schemas/RejectionRound"
            - type: "null"
        rejectionDate:
          type: ["string", "null"]
          format: date
        rejectionReason:
          type: ["string", "null"]
        stageDetail:
          type: ["string", "null"]
        source:
          type: string
          enum: [manual, email]
        lastEmailAt:
          type: ["string", "null"]
          format: date-time
        nextAt:
          type: ["string", "null"]
          format: date-time
        nextAtHasTime:
          type: boolean
        nextType:
          type: ["string", "null"]
        actionRequired:
          type: boolean
        actionNote:
          type: ["string", "null"]
        isSample:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationInput:
      type: object
      required: [companyName, appliedDate, mode, status]
      properties:
        companyName:
          type: string
          minLength: 1
          maxLength: 160
        role:
          type: ["string", "null"]
          maxLength: 160
        packageLpa:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000
        location:
          type: ["string", "null"]
          maxLength: 160
        appliedDate:
          type: string
          format: date
        mode:
          $ref: "#/components/schemas/ApplicationMode"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        nextDate:
          type: ["string", "null"]
          format: date
        contactName:
          type: ["string", "null"]
          maxLength: 160
        contactEmailOrPhone:
          type: ["string", "null"]
          maxLength: 254
        jobLink:
          type: ["string", "null"]
          format: uri
          maxLength: 2048
        notes:
          type: ["string", "null"]
          maxLength: 10000
        rejectionRound:
          oneOf:
            - $ref: "#/components/schemas/RejectionRound"
            - type: "null"
